name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run lint` is not run yet: it fails on pre-existing errors. Add it
      # here and to prepublishOnly once `npm run lint` passes.
      - run: npm run typecheck
      - run: npm run build
