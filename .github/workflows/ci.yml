name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The plugin-kit CLI (run by `npm run build`) needs Node 24
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx oxfmt --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The offline test Studio: the fake Content Lake and `sanity dev`
      - name: Start the test Studio
        run: |
          npm run dev > studio.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3333 > /dev/null && curl -skf https://localhost:3334/v1/users/me > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat studio.log
          exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            studio.log
            interaction-failure-*.png
