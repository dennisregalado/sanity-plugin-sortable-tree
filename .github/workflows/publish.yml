name: Publish

# Merging to main publishes the version in package.json to npm, then creates
# the matching v<version> tag and GitHub release. If that version is already on
# npm (a merge without a version bump), nothing happens.
#
# npm trusts this workflow directly (trusted publishing): no token or 2FA code
# is needed. Set up once on npmjs.com: package Settings > Trusted publishing >
# GitHub Actions, repository dennisregalado/sanity-plugin-sortable-tree,
# workflow publish.yml.
#
# Run it by hand from the Actions tab (workflow_dispatch) to retry a failed
# publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already on npm
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      # prepublishOnly runs the typecheck and the build.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create tag and GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --generate-notes --target "$GITHUB_SHA" "${prerelease[@]}"
